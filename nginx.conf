server {
    listen 80;
    # `_` (catch-all) membuat nginx tetap cocok apa pun Host yang dikirim
    # Traefik (app.domain-anda.com), bukan hanya "localhost".
    server_name _;

    # Jangan bocorkan versi nginx di header Server dan halaman error.
    server_tokens off;

    # API menerima upload Excel sampai 50MB (lihat bodyLimit di apps/api/src/server.ts).
    # Default nginx hanya 1MB, sehingga upload besar akan gagal 413 tanpa baris ini.
    client_max_body_size 60m;

    # ── Header keamanan ────────────────────────────────────────────────────
    # Dipasang di level server dan TIDAK memakai add_header di dalam location,
    # karena add_header di location membatalkan seluruh header warisan dari
    # level server.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Tanpa includeSubDomains: kalau ada subdomain lain di domain yang sama
    # masih memakai http, menambahkan includeSubDomains akan membuatnya tidak
    # bisa diakses sama sekali selama 1 tahun.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # script-src 'self' memblokir skrip inline — jalur utama serangan XSS.
    # connect-src dibuka ke https: karena alamat API berbeda subdomain dan baru
    # diketahui saat build, sehingga tidak bisa di-hardcode di file ini.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Aset hasil build Vite punya hash di nama file, jadi aman di-cache lama.
    # `expires` dipakai (bukan add_header) agar header keamanan di atas tetap
    # ikut terkirim untuk file JS/CSS.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache supaya rilis baru langsung terpakai.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
