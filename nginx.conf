server {
    listen 80;
    server_name localhost;

    # API menerima upload Excel sampai 50MB (lihat bodyLimit di apps/api/src/server.ts).
    # Default nginx hanya 1MB, sehingga upload besar akan gagal 413 tanpa baris ini.
    client_max_body_size 60m;

    # Aset hasil build Vite punya hash di nama file, jadi aman di-cache lama.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache supaya rilis baru langsung terpakai.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
